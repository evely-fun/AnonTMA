databases:
  - name: anontma-db
    databaseName: anontma
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: anontma-cache
    plan: starter
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: anontma-api
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws websockets --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: anontma-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: anontma-cache
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PAYLOAD_ENCRYPTION_KEY
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
